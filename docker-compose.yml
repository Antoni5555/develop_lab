# Окружение для разработки: docker compose up --build → http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт открыт только для своего компьютера — чтобы запускать pytest и manage.py без Docker
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Локальный почтовый ящик: письма сайта (подтверждение почты, сброс пароля)
  # не уходят наружу, а видны в браузере — http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"

  web:
    build: .
    env_file: .env
    # Внутри Docker база и Redis доступны по именам сервисов, а не по localhost
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CONTENT_DIR: /content
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    # Код подключён папкой: правки видны сразу, runserver перезапускается сам.
    # Миграции при старте — только в разработке; на сервере это отдельный шаг деплоя.
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./src:/app
      # Контент — только для чтения: load_content читает, но не меняет его
      - ./content:/content:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
