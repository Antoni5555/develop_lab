<ol class="how-steps">
  <li><b>Пишете заметку</b> в правой панели урока, задачи или тренажёра: тему и текст.</li>
  <li><b>Сохраняете</b> — она попадает в шпаргалку этого курса, в ту тему, где вы её написали.</li>
  <li><b>Повторяете</b> — открываете курс здесь и видите все свои выписки по темам.</li>
</ol>
