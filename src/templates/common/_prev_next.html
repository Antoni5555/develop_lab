{# Соседние уроки. Параметры: prev, next — темы (Topic) или None. #}
<nav class="prev-next">
  {% if prev %}<a href="{{ prev.get_absolute_url }}" class="prev-next__link"><span class="muted">← Назад</span>{{ prev.title }}</a>{% else %}<span></span>{% endif %}
  {% if next %}<a href="{{ next.get_absolute_url }}" class="prev-next__link prev-next__link--next"><span class="muted">Дальше →</span>{{ next.title }}</a>{% endif %}
</nav>
