{# Соседние шаги курса. Параметры: prev, next — CourseItem (title, url) или None. #}
<nav class="prev-next">
  {% if prev %}<a href="{{ prev.url }}" class="prev-next__link"><span class="muted">← Назад</span>{{ prev.title }}</a>{% else %}<span></span>{% endif %}
  {% if next %}<a href="{{ next.url }}" class="prev-next__link prev-next__link--next"><span class="muted">Дальше →</span>{{ next.title }}</a>{% endif %}
</nav>
