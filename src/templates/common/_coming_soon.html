{# Заглушка «в разработке». Параметры: stage — номер этапа, когда раздел появится, или text — свой текст. #}
<div class="alert alert--loading">
  <div>{% if text %}{{ text }}{% else %}<strong>Раздел в разработке.</strong> Появится на этапе {{ stage }}.{% endif %} <a href="{% url 'pages:home' %}">На главную →</a></div>
</div>
