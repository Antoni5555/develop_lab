<div class="cta">
  <div>
    <h2 class="cta__title">Начни с первого шага</h2>
    <p class="cta__text">Регистрация не нужна. Аккаунт — когда захочешь сохранить прогресс и шпаргалки.</p>
  </div>
  <div class="cta__actions">
    {% if first_card %}<a href="{{ first_card.course.get_absolute_url }}" class="btn btn--accent btn--lg">Начать с {{ first_card.course.title }}</a>{% endif %}
    {% if not user.is_authenticated %}<a href="{% url 'account_signup' %}" class="btn btn--on-ink btn--lg">Создать аккаунт</a>{% endif %}
  </div>
</div>
