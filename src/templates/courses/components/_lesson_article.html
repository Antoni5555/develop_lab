{# Урок: HTML собран из Markdown командой load_content (apps/courses/services/rendering.py) #}

  <div class="article__meta"><span class="tag">Урок</span><span class="muted">{{ lesson.reading_time }} мин</span><span class="muted">{{ section.title }}</span></div>

</article>
