title: Отказы не попадают в журнал
type: exercise
difficulty: 3
pitfall: Порядок декораторов определяет, какая обёртка срабатывает первой.
statement: |
  Служба безопасности требует, чтобы в журнал `AUDIT` попадали **все** попытки изменить цену —
  и успешные, и отклонённые. Сейчас записываются только успешные. Исправьте порядок
  декораторов над `change_price` (сами декораторы не меняйте).
starter_code: |
  import functools

  AUDIT = []


  def audit(func):
      @functools.wraps(func)
      def wrapper(user, *args, **kwargs):
          AUDIT.append((user["name"], func.__name__))
          return func(user, *args, **kwargs)
      return wrapper


  def require_role(role):
      def decorator(func):
          @functools.wraps(func)
          def wrapper(user, *args, **kwargs):
              if user["role"] != role:
                  return {"status": 403}
              return func(user, *args, **kwargs)
          return wrapper
      return decorator


  @require_role("manager")
  @audit
  def change_price(user, product_id, price):
      return {"status": 200, "price": price}
check:
  type: tests
  tests:
    - code: |
        AUDIT.clear()
        result = change_price({"name": "Анна", "role": "customer"}, 42, 1)
        assert result == {"status": 403} and AUDIT == [("Анна", "change_price")]
      fail: "Отклонённая попытка не записана в журнал. Какая обёртка срабатывает первой при вызове?"
    - code: |
        AUDIT.clear()
        assert change_price({"name": "Ольга", "role": "manager"}, 42, 1599) == {"status": 200, "price": 1599}
        assert AUDIT == [("Ольга", "change_price")]
      fail: Успешная попытка тоже должна записываться — ровно один раз.
solution: |
  import functools

  AUDIT = []


  def audit(func):
      @functools.wraps(func)
      def wrapper(user, *args, **kwargs):
          AUDIT.append((user["name"], func.__name__))
          return func(user, *args, **kwargs)
      return wrapper


  def require_role(role):
      def decorator(func):
          @functools.wraps(func)
          def wrapper(user, *args, **kwargs):
              if user["role"] != role:
                  return {"status": 403}
              return func(user, *args, **kwargs)
          return wrapper
      return decorator


  @audit
  @require_role("manager")
  def change_price(user, product_id, price):
      return {"status": 200, "price": price}
hints:
  - "При вызове первой срабатывает верхняя обёртка."
  - Журнал должен увидеть вызов раньше проверки прав.
explanation: |
  `@require_role` над `@audit` — значит, при вызове первой работает проверка прав. Покупателю она
  возвращает 403 и до `audit` дело не доходит. Когда `audit` снаружи, он записывает каждую попытку,
  а потом передаёт вызов проверке прав.
