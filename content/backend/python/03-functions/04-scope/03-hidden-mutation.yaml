title: Подарок попал в обычную корзину
type: exercise
difficulty: 2
pitfall: Функция, изменяющая переданный список, меняет данные вызывающего кода.
statement: |
  `with_gift(cart)` должна вернуть **новую** корзину: товары `cart` плюс `"открытка"` в конце.
  После её вызова открытка появляется и в исходной корзине покупателя. Исправьте функцию.
starter_code: |
  def with_gift(cart):
      cart.append("открытка")
      return cart
check:
  type: tests
  tests:
    - code: |
        cart = ["мышь", "коврик"]
        with_gift(cart)
        assert cart == ["мышь", "коврик"]
      fail: "Исходная корзина изменилась. Функция получила тот же список, что и вызывающий код."
    - code: |
        assert with_gift(["мышь"]) == ["мышь", "открытка"]
      fail: Новая корзина — товары плюс открытка в конце.
    - code: |
        cart = []
        assert with_gift(cart) is not cart
      fail: Функция должна вернуть новый список, а не исходный.
solution: |
  def with_gift(cart):
      return cart + ["открытка"]
hints:
  - Параметр `cart` указывает на тот же список, что и переменная вызывающего кода.
  - "`+` создаёт новый список."
explanation: |
  В функцию передаётся не копия, а тот же объект. `append` меняет его — изменение видно снаружи.
  `cart + ["открытка"]` (или копия `cart.copy()` перед `append`) создаёт новый список, а исходный
  остаётся нетронутым.
