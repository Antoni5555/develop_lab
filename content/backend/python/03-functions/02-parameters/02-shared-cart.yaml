title: Чужие товары в новой корзине
type: exercise
difficulty: 2
pitfall: Изменяемое значение по умолчанию создаётся один раз и общее для всех вызовов.
statement: |
  `add_to_cart(item, cart=...)` добавляет товар в переданную корзину, а если корзину не передали —
  в новую пустую. Новые покупатели видят в корзине чужие товары. Исправьте функцию.
starter_code: |
  def add_to_cart(item, cart=[]):
      cart.append(item)
      return cart
check:
  type: tests
  tests:
    - code: |
        assert add_to_cart("мышь") == ["мышь"]
        assert add_to_cart("коврик") == ["коврик"]
      fail: "Второй вызов без корзины вернул и товар первого. Когда создаётся список из значения по умолчанию?"
    - code: |
        cart = ["кабель"]
        assert add_to_cart("мышь", cart) == ["кабель", "мышь"] and cart == ["кабель", "мышь"]
      fail: Если корзину передали, товар добавляется в неё.
solution: |
  def add_to_cart(item, cart=None):
      if cart is None:
          cart = []
      cart.append(item)
      return cart
hints:
  - "`[]` в заголовке функции вычисляется один раз — при выполнении `def`."
  - "Значение по умолчанию — `None`, а новый список создайте внутри функции."
explanation: |
  Значение по умолчанию хранится в самой функции и создаётся при `def`. Все вызовы без `cart`
  получают один и тот же список, и `append` копит в нём товары всех покупателей. `None` неизменяем,
  а новый список создаётся внутри функции при каждом вызове.
