title: Все товары одной строкой
type: exercise
difficulty: 3
pitfall: Жадное .* захватывает до последнего совпадения — нужно ленивое .*?.
statement: |
  Комментарий к заказу содержит названия товаров в двойных кавычках:
  `В корзине "Мышь" и "Коврик"`. `quoted_names(text)` должна вернуть список названий
  в порядке появления: `["Мышь", "Коврик"]`. Сейчас она возвращает одну длинную строку.
starter_code: |
  import re


  def quoted_names(text):
      return re.findall(r'"(.*)"', text)
check:
  type: tests
  tests:
    - code: |
        assert quoted_names('В корзине "Мышь" и "Коврик"') == ["Мышь", "Коврик"]
      fail: "Вернулось `['Мышь\" и \"Коврик']`. Сколько символов захватывает `.*`?"
    - code: |
        assert quoted_names('"Кабель"') == ["Кабель"] and quoted_names("без кавычек") == []
      fail: Одно название — список из одного элемента; без кавычек — пустой список.
solution: |
  import re


  def quoted_names(text):
      return re.findall(r'"(.*?)"', text)
hints:
  - "`.*` — жадное: захватывает до последней кавычки."
  - "`.*?` — ленивое, или набор «всё, кроме кавычки» `[^\"]*`."
explanation: |
  Жадное `.*` берёт как можно больше и останавливается на последней кавычке строки — оба названия
  и текст между ними попадают в одну группу. `.*?` берёт минимум — до ближайшей кавычки.
  Ещё точнее — `"([^"]*)"`: внутри кавычек не может быть кавычки.
