title: Набор товаров одной позицией
type: exercise
difficulty: 2
pitfall: append добавляет список как один вложенный элемент.
statement: |
  Покупатель добавил в корзину комплект — список товаров `bundle`. Каждый товар комплекта
  должен стать отдельной позицией корзины `cart`. Сейчас комплект попадает в корзину целиком,
  одним элементом, и счётчик позиций врёт.
inputs: |
  cart = ["мышь"]
  bundle = ["коврик", "кабель"]
starter_code: |
  # cart и bundle — входные данные задачи
  cart.append(bundle)
  print(len(cart), cart)
check:
  type: tests
  tests:
    - code: assert run(cart=["мышь"], bundle=["коврик", "кабель"])["cart"] == ["мышь", "коврик", "кабель"]
      fail: "В корзине оказался вложенный список. Как добавить элементы другого списка по одному?"
    - code: assert run(cart=[], bundle=["мышь", "коврик", "кабель"])["cart"] == ["мышь", "коврик", "кабель"]
      fail: Комплект из трёх товаров — три позиции.
solution: |
  cart.extend(bundle)
  print(len(cart), cart)
hints:
  - Выведите `cart` после `append` — сколько в нём элементов?
  - "Метод `extend`."
explanation: |
  `append` всегда добавляет ровно один элемент — каким бы он ни был, хоть списком. Получается
  `["мышь", ["коврик", "кабель"]]` — длина 2. `extend` (или `cart += bundle`) добавляет элементы
  переданного списка по одному.
