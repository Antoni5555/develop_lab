title: Корзина пропала
type: exercise
difficulty: 1
pitfall: Методы, меняющие список, возвращают None.
statement: |
  При добавлении товара корзина покупателя «исчезает»: после добавления в `cart` оказывается `None`.
  Исправьте код: товар `item` должен добавиться в конец корзины `cart`.
inputs: |
  cart = ["мышь", "клавиатура"]
  item = "коврик"
starter_code: |
  # cart и item — входные данные задачи
  cart = cart.append(item)
  print(cart)
check:
  type: tests
  tests:
    - code: assert run(cart=["мышь", "клавиатура"], item="коврик")["cart"] == ["мышь", "клавиатура", "коврик"]
      fail: "В `cart` оказалось `None`. Что возвращает `append`?"
    - code: assert run(cart=[], item="мышь")["cart"] == ["мышь"]
      fail: В пустую корзину товар тоже должен добавиться.
solution: |
  cart.append(item)
  print(cart)
hints:
  - Выведите результат `cart.append(item)`.
  - "`append` меняет список на месте — присваивать нечего."
explanation: |
  `append` изменяет сам список и возвращает `None`. Присваивание `cart = cart.append(item)` записывает
  этот `None` в `cart`, и корзина теряется. У строк наоборот: методы возвращают новую строку,
  поэтому там присваивание обязательно. Нужно помнить, какой тип изменяемый.
