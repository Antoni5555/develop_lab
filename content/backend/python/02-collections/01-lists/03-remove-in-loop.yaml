title: Товар остался в корзине
type: exercise
difficulty: 2
pitfall: Удаление элементов из списка во время его обхода пропускает элементы.
statement: |
  Товар `out_of_stock` закончился на складе — его нужно убрать из корзины `cart` полностью,
  сколько бы раз он там ни встречался. Сейчас часть экземпляров остаётся.
  После вашего кода в `cart` не должно быть ни одного `out_of_stock`, остальные товары — в прежнем порядке.
inputs: |
  cart = ["мышь", "кабель", "кабель", "коврик"]
  out_of_stock = "кабель"
starter_code: |
  # cart и out_of_stock — входные данные задачи
  for item in cart:
      if item == out_of_stock:
          cart.remove(item)
check:
  type: tests
  tests:
    - code: assert run(cart=["мышь", "кабель", "кабель", "коврик"], out_of_stock="кабель")["cart"] == ["мышь", "коврик"]
      fail: "Один «кабель» остался. Что происходит со следующим элементом, когда цикл удаляет текущий?"
    - code: assert run(cart=["кабель", "кабель", "кабель"], out_of_stock="кабель")["cart"] == []
      fail: Если вся корзина — закончившийся товар, она должна стать пустой.
    - code: assert run(cart=["мышь", "коврик"], out_of_stock="кабель")["cart"] == ["мышь", "коврик"]
      fail: Если товара нет в корзине, она не меняется.
solution: |
  result = []
  for item in cart:
      if item != out_of_stock:
          result.append(item)
  cart = result
hints:
  - "После `remove` элементы сдвигаются влево, а цикл переходит к следующему индексу."
  - Соберите новый список из товаров, которые нужно оставить.
explanation: |
  `for` идёт по списку по индексам. Когда на индексе 1 удаляется «кабель», второй «кабель» сдвигается
  на индекс 1 — а цикл уже переходит к индексу 2 и пропускает его. Надёжный способ — построить новый
  список из нужных элементов (позже это будет одна строка-comprehension). Другой вариант —
  `while out_of_stock in cart: cart.remove(out_of_stock)`.
