title: Карточка старого товара
type: exercise
difficulty: 1
pitfall: Обращение через квадратные скобки к отсутствующему ключу падает с KeyError.
statement: |
  Поле `"color"` появилось у товаров недавно — у старых его нет. Из-за этого карточка
  старого товара не открывается. Соберите подпись `label` вида `Беспроводная мышь (цвет: black)`;
  если цвета нет — `Беспроводная мышь (цвет: не указан)`.
inputs: |
  product = {"name": "Беспроводная мышь", "price": 1499}
starter_code: |
  # product — входные данные задачи
  label = f"{product['name']} (цвет: {product['color']})"
check:
  type: tests
  tests:
    - code: |
        assert run(product={"name": "Беспроводная мышь", "price": 1499})["label"] == "Беспроводная мышь (цвет: не указан)"
      fail: "У товара нет ключа `color` — квадратные скобки дают `KeyError`. Как прочитать значение безопасно?"
    - code: |
        assert run(product={"name": "Коврик", "color": "black"})["label"] == "Коврик (цвет: black)"
      fail: Если цвет есть, он должен попасть в подпись.
solution: |
  label = f"{product['name']} (цвет: {product.get('color', 'не указан')})"
hints:
  - "Метод `get` принимает второй аргумент — значение по умолчанию."
explanation: |
  `product["color"]` требует, чтобы ключ был. Для полей, которых может не быть, — `get` со значением
  по умолчанию: `product.get("color", "не указан")`. Ключ при этом в словарь не добавляется.
