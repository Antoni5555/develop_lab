<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" class="fig" role="img" aria-labelledby="t"><title id="t">Присваивание, поверхностная и глубокая копия списка со вложенным словарём</title>
<style>
