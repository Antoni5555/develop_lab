title: Подарочная корзина
type: exercise
difficulty: 1
pitfall: Присваивание не копирует список — оба имени указывают на один объект.
statement: |
  Подарочная корзина `gift_cart` создаётся на основе корзины покупателя `cart`, и в неё
  добавляется открытка. Покупатели жалуются: открытка появляется и в их обычной корзине.
  Исправьте код так, чтобы `cart` не менялась.
inputs: |
  cart = ["мышь", "коврик"]
starter_code: |
  # cart — входные данные задачи
  gift_cart = cart
  gift_cart.append("открытка")
check:
  type: tests
  tests:
    - code: |
        r = run(cart=["мышь", "коврик"])
        assert r["cart"] == ["мышь", "коврик"]
      fail: "В корзине покупателя появилась открытка. Выведите `gift_cart is cart` — это разные списки?"
    - code: |
        r = run(cart=["мышь", "коврик"])
        assert r["gift_cart"] == ["мышь", "коврик", "открытка"]
      fail: Подарочная корзина — товары покупателя плюс открытка.
solution: |
  gift_cart = cart.copy()
  gift_cart.append("открытка")
hints:
  - "`gift_cart = cart` не создаёт новый список."
explanation: |
  Присваивание даёт списку второе имя, и `append` через любое имя меняет один и тот же список.
  `cart.copy()` (или `list(cart)`, `cart[:]`) создаёт новый список с теми же элементами —
  дальше его можно менять независимо.
