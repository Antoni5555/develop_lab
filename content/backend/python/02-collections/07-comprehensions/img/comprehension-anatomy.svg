<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="36.4" y="47" width="104.80000000000001" height="24" rx="5" class="fig-acc"/>
<circle cx="88.80000000000001" cy="34" r="10" class="fig-acc fig-venn"/>
<text x="88.80000000000001" y="38" text-anchor="middle" class="fig-cs">1</text>
<rect x="145.60000000000002" y="47" width="172.0" height="24" rx="5" class="fig-m1"/>
<circle cx="231.60000000000002" cy="34" r="10" class="fig-m1 fig-venn"/>
<text x="231.60000000000002" y="38" text-anchor="middle" class="fig-cs">2</text>
<rect x="322.0" y="47" width="172.0" height="24" rx="5" class="fig-m3"/>
<circle cx="408.0" cy="34" r="10" class="fig-m3 fig-venn"/>
<text x="408.0" y="38" text-anchor="middle" class="fig-cs">3</text>
<text x="30" y="64" text-anchor="start" class="fig-c">[item[&quot;name&quot;] for item in products if item[&quot;stock&quot;] &gt; 0]</text>
<text x="30" y="112" text-anchor="start" class="fig-s">то же самое циклом:</text>
<rect x="28.0" y="157" width="172.0" height="24" rx="5" class="fig-m1"/>
<rect x="61.6" y="185" width="172.0" height="24" rx="5" class="fig-m3"/>
<rect x="204.4" y="213" width="104.80000000000001" height="24" rx="5" class="fig-acc"/>
<text x="30" y="146" text-anchor="start" class="fig-c">names = []</text>
<text x="30" y="174" text-anchor="start" class="fig-c">for item in products:</text>
<text x="30" y="202" text-anchor="start" class="fig-c">    if item[&quot;stock&quot;] &gt; 0:</text>
<text x="30" y="230" text-anchor="start" class="fig-c">        names.append(item[&quot;name&quot;])</text>
<text x="30" y="272" text-anchor="start" class="fig-s">1 — что кладём в результат   2 — откуда берём элементы   3 — какие оставляем (необязательно)</text>
