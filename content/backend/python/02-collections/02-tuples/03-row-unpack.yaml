title: Новое поле в выгрузке
type: exercise
difficulty: 2
pitfall: Распаковка требует точного совпадения числа переменных и элементов.
statement: |
  Старая версия API присылает заказ кортежем `(order_id, status)`, новая —
  `(order_id, status, created_at)`, а следующая может добавить ещё поля.
  После перехода на новое API скрипт падает. Сделайте так, чтобы `order_id` и `status`
  извлекались из записи `row` любой длины (минимум два поля).
inputs: |
  row = (1042, "paid", "2026-10-20")
starter_code: |
  # row — входные данные задачи
  order_id, status = row
  print(order_id, status)
check:
  type: tests
  tests:
    - code: |
        r = run(row=(1042, "paid", "2026-10-20"))
        assert (r["order_id"], r["status"]) == (1042, "paid")
      fail: "Для записи из трёх полей распаковка падает. Как собрать «лишние» элементы в одну переменную?"
    - code: |
        r = run(row=(1043, "new"))
        assert (r["order_id"], r["status"]) == (1043, "new")
      fail: Старый формат из двух полей тоже должен работать.
    - code: |
        r = run(row=(1044, "shipped", "2026-10-20", "courier", 199))
        assert (r["order_id"], r["status"]) == (1044, "shipped")
      fail: Будущие версии с большим числом полей тоже должны работать.
solution: |
  order_id, status, *_ = row
  print(order_id, status)
hints:
  - "`ValueError: too many values to unpack` — переменных меньше, чем элементов."
  - Звёздочка собирает остаток в список; если остаток не нужен, его называют `_`.
explanation: |
  Обычная распаковка требует, чтобы элементов было ровно столько, сколько переменных.
  `order_id, status, *_ = row` берёт первые два поля, а всё остальное (или ничего) кладёт в `_` —
  так скрипт переживает добавление новых полей. Вариант через индексы `row[0]`, `row[1]` тоже рабочий.
