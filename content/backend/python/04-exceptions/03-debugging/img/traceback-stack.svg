<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="20" width="600" height="336" rx="14" class="fig-term"/>
<text x="36" y="50" text-anchor="start" class="fig-tt">Traceback (most recent call last):</text>
<text x="36" y="78" text-anchor="start" class="fig-tt">  File &quot;main.py&quot;, line 12, in &lt;module&gt;</text>
<text x="36" y="106" text-anchor="start" class="fig-tt">    print(checkout([1499, 490], &quot;WINTER-15&quot;))</text>
<text x="36" y="134" text-anchor="start" class="fig-tterr">          ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^</text>
<text x="36" y="162" text-anchor="start" class="fig-tt">  File &quot;main.py&quot;, line 8, in checkout</text>
<text x="36" y="190" text-anchor="start" class="fig-tt">    percent = parse_percent(code)</text>
<text x="36" y="218" text-anchor="start" class="fig-tterr">              ^^^^^^^^^^^^^^^^^^^</text>
<text x="36" y="246" text-anchor="start" class="fig-tt">  File &quot;main.py&quot;, line 3, in parse_percent</text>
<text x="36" y="274" text-anchor="start" class="fig-tt">    return int(code[5:])</text>
<text x="36" y="302" text-anchor="start" class="fig-tterr">           ^^^^^^^^^^^^^</text>
<text x="36" y="330" text-anchor="start" class="fig-tterr">ValueError: invalid literal for int() with base 10: 'R-15'</text>
<path d="M624 325H660" class="fig-lnd"/>
<circle cx="674" cy="325" r="11" class="fig-acc"/>
<text x="674" y="330" text-anchor="middle" class="fig-onacc">1</text>
<text x="692" y="330" text-anchor="start" class="fig-s">что случилось</text>
<path d="M624 269H660" class="fig-lnd"/>
<circle cx="674" cy="269" r="11" class="fig-acc"/>
<text x="674" y="274" text-anchor="middle" class="fig-onacc">2</text>
<text x="692" y="274" text-anchor="start" class="fig-s">где упало: последний кадр</text>
<path d="M624 185H660" class="fig-lnd"/>
<circle cx="674" cy="185" r="11" class="fig-acc"/>
<text x="674" y="190" text-anchor="middle" class="fig-onacc">3</text>
<text x="692" y="190" text-anchor="start" class="fig-s">кто вызвал parse_percent</text>
<path d="M624 101H660" class="fig-lnd"/>
<circle cx="674" cy="101" r="11" class="fig-acc"/>
<text x="674" y="106" text-anchor="middle" class="fig-onacc">4</text>
<text x="692" y="106" text-anchor="start" class="fig-s">откуда всё началось</text>
<text x="20" y="384" text-anchor="start" class="fig-s">Упало в parse_percent, а причина — в допущении «префикс промокода всегда из 4 букв».</text>
</svg>
