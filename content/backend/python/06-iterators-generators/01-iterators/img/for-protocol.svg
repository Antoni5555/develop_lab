<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="240" y="20" width="280" height="44" rx="12" class="fig-box"/>
<text x="380.0" y="47.0" text-anchor="middle" class="fig-c">for item in cart:</text>
<path d="M380 64V92" class="fig-ln" marker-end="url(#a)"/>
<rect x="240" y="96" width="280" height="44" rx="12" class="fig-box2"/>
<text x="380.0" y="123.0" text-anchor="middle" class="fig-c">it = iter(cart)</text>
