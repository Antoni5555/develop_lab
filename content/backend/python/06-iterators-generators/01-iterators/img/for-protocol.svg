<text x="40" y="214" text-anchor="start" class="fig-s">элемент</text>
<rect x="580" y="184" width="160" height="44" rx="12" class="fig-ok"/>
<text x="660.0" y="211.0" text-anchor="middle" class="fig-t">выход из цикла</text>
<path d="M530 206H576" class="fig-ln" marker-end="url(#a)"/>
<text x="540" y="176" text-anchor="start" class="fig-s">StopIteration</text>
