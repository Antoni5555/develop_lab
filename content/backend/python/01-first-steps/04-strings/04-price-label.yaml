title: Ценник с фигурными скобками
type: exercise
difficulty: 2
pitfall: Без префикса f фигурные скобки остаются в тексте как есть.
statement: |
  На карточке товара вместо цены покупатели видят `{price}`. Исправьте код:
  в `label` должно получиться, например, `Беспроводная мышь — 1499 ₽`.
inputs: |
  name = "Беспроводная мышь"
  price = 1499
starter_code: |
  # name и price — входные данные задачи
  label = "{name} — {price} ₽"
  print(label)
check:
  type: tests
  tests:
    - code: assert run(name="Беспроводная мышь", price=1499)["label"] == "Беспроводная мышь — 1499 ₽"
      fail: "В тексте остались фигурные скобки. Чего не хватает строке, чтобы Python подставил значения?"
    - code: assert run(name="Механическая клавиатура", price=5990)["label"] == "Механическая клавиатура — 5990 ₽"
      fail: Ценник должен строиться из переменных, а не быть написан вручную.
solution: |
  label = f"{name} — {price} ₽"
  print(label)
hints:
  - Сравните строку в коде с примерами f-строк из урока.
explanation: |
  Подстановка `{...}` работает только в f-строках — с буквой `f` перед кавычками.
  Обычная строка с фигурными скобками — это просто текст, Python ничего не подставляет и не ругается.
