title: Разбор артикула
type: exercise
difficulty: 2
pitfall: Конец среза не входит в результат.
statement: |
  Артикул товара устроен так: `KB-0142-BLK` — категория, номер, цвет через дефис.
  Разложите `sku` по переменным: `category` (`"KB"`), `number` (`"0142"`), `color` (`"BLK"`).
  Части всегда одинаковой длины: 2, 4 и 3 символа.
inputs: |
  sku = "KB-0142-BLK"
starter_code: |
  # sku — входные данные задачи
  category = sku[0:1]
  number = sku[3:6]
  color = sku[8:10]
check:
  type: tests
  tests:
    - code: |
        r = run(sku="KB-0142-BLK")
        assert (r["category"], r["number"], r["color"]) == ("KB", "0142", "BLK")
      fail: "Части обрезаны на один символ. Срез `[a:b]` берёт символы с индексами a … b-1."
    - code: |
        r = run(sku="MS-0007-WHT")
        assert (r["category"], r["number"], r["color"]) == ("MS", "0007", "WHT")
      fail: Для другого артикула той же структуры части тоже должны выделяться верно.
solution: |
  category = sku[:2]
  number = sku[3:7]
  color = sku[8:]
hints:
  - "Выпишите индексы: K=0, B=1, -=2, 0=3, 1=4, 4=5, 2=6, -=7, B=8…"
  - Конец среза — индекс первого символа, который в срез **не** входит.
explanation: |
  `sku[3:7]` — символы с индексами 3, 4, 5, 6. Граница 7 не входит — поэтому срез «на один длиннее»,
  чем последний нужный индекс. Пропущенная граница означает «с начала» или «до конца»: `sku[:2]`, `sku[8:]`.
  Ещё вариант — `sku.split("-")`: он не зависит от длины частей.
