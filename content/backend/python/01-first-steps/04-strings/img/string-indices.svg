<text x="302.0" y="76" text-anchor="middle" class="fig-cs">3</text>
<text x="302.0" y="172" text-anchor="middle" class="fig-cs">-4</text>
<rect x="340" y="90" width="64" height="56" rx="10" class="fig-acc"/>
<text x="372.0" y="125" text-anchor="middle" class="fig-onacc">1</text>
<text x="372.0" y="76" text-anchor="middle" class="fig-cs">4</text>
<text x="372.0" y="172" text-anchor="middle" class="fig-cs">-3</text>
<rect x="410" y="90" width="64" height="56" rx="10" class="fig-acc"/>
<text x="442.0" y="125" text-anchor="middle" class="fig-onacc">4</text>
<text x="442.0" y="76" text-anchor="middle" class="fig-cs">5</text>
<text x="442.0" y="172" text-anchor="middle" class="fig-cs">-2</text>
<rect x="480" y="90" width="64" height="56" rx="10" class="fig-acc"/>
<text x="512.0" y="125" text-anchor="middle" class="fig-onacc">2</text>
<text x="512.0" y="76" text-anchor="middle" class="fig-cs">6</text>
<text x="512.0" y="172" text-anchor="middle" class="fig-cs">-1</text>
<text x="20" y="30" text-anchor="start" class="fig-c">sku = &quot;KB-0142&quot;</text>
<text x="20" y="214" text-anchor="start" class="fig-c">sku[3:7] → &quot;0142&quot;  (символы 3, 4, 5, 6 — индекс 7 не входит)</text>
<text x="20" y="238" text-anchor="start" class="fig-cs">sku[0] → &quot;K&quot;   sku[-1] → &quot;2&quot;   sku[:2] → &quot;KB&quot;</text>
