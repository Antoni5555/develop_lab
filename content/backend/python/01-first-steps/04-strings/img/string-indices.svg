<text x="232.0" y="125" text-anchor="middle" class="fig-c">-</text>
<text x="232.0" y="76" text-anchor="middle" class="fig-cs">2</text>
<text x="232.0" y="172" text-anchor="middle" class="fig-cs">-5</text>
