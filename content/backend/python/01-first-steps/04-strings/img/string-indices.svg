<text x="92.0" y="125" text-anchor="middle" class="fig-c">K</text>
<text x="92.0" y="76" text-anchor="middle" class="fig-cs">0</text>
<text x="92.0" y="172" text-anchor="middle" class="fig-cs">-7</text>
