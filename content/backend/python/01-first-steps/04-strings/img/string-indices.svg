<text x="162.0" y="125" text-anchor="middle" class="fig-c">B</text>
<text x="162.0" y="76" text-anchor="middle" class="fig-cs">1</text>
<text x="162.0" y="172" text-anchor="middle" class="fig-cs">-6</text>
