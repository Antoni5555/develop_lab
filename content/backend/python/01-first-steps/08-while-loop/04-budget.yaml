title: Корзина в пределах бюджета
type: exercise
difficulty: 2
pitfall: Проверка условия после действия пропускает лишнюю итерацию.
statement: |
  Покупатель хочет купить как можно больше товаров по цене `price`, не выходя за бюджет `budget`.
  Посчитайте в `count` число товаров и в `total` их стоимость. Сейчас корзина превышает бюджет.
inputs: |
  budget = 5000
  price = 1499
starter_code: |
  # budget и price — входные данные задачи
  total = 0
  count = 0
  while total <= budget:
      total += price
      count += 1
check:
  type: tests
  tests:
    - code: |
        r = run(budget=5000, price=1499)
        assert (r["count"], r["total"]) == (3, 4497)
      fail: "На 5000 ₽ помещаются 3 товара по 1499 ₽ (4497 ₽). Четвёртый уже превышает бюджет — когда он добавляется?"
    - code: |
        r = run(budget=4497, price=1499)
        assert (r["count"], r["total"]) == (3, 4497)
      fail: "Бюджет 4497 ₽ — ровно 3 товара. Потратить весь бюджет можно."
    - code: |
        r = run(budget=1000, price=1499)
        assert (r["count"], r["total"]) == (0, 0)
      fail: "Если даже один товар дороже бюджета, корзина пустая."
solution: |
  total = 0
  count = 0
  while total + price <= budget:
      total += price
      count += 1
hints:
  - "Условие проверяет сумму **до** добавления товара, а добавление может превысить бюджет."
  - Проверяйте, поместится ли следующий товар.
explanation: |
  Условие `total <= budget` отвечает на вопрос «превышен ли бюджет сейчас», а нужно — «поместится ли
  следующий товар». Поэтому последний товар добавляется уже сверх бюджета. Проверка `total + price <= budget`
  смотрит на результат действия до того, как его сделать.
