title: Статус на одной строке
type: exercise
difficulty: 2
pitfall: Каждый print заканчивается переводом строки — чтобы продолжить строку, меняют end.
statement: |
  Сервис оплаты пишет статус в две стадии: сначала `Проверяем оплату...`, потом — результат `готово`.
  Это два отдельных вызова `print` — оставьте их двумя.
  Сделайте так, чтобы программа вывела одну строку: `Проверяем оплату... готово`.
starter_code: |
  print("Проверяем оплату...")
  print("готово")
check:
  type: tests
  tests:
    - code: assert output == "Проверяем оплату... готово\n"
      fail: "Нужна одна строка с одним пробелом между частями. Что `print` печатает в конце по умолчанию?"
    - code: assert source.count("print(") == 2
      fail: Оставьте два вызова `print` — в реальном сервисе стадии печатаются в разные моменты.
solution: |
  print("Проверяем оплату...", end=" ")
  print("готово")
hints:
  - Первый `print` должен закончить вывод не переводом строки, а пробелом.
  - Параметр `end`.
explanation: |
  `print` после значений печатает `end`, а по умолчанию `end="\n"` — перевод строки.
  С `end=" "` первый вызов заканчивается пробелом, и второй продолжает ту же строку.
