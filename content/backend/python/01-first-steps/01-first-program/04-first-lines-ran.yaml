title: Упало на середине
type: exercise
difficulty: 2
pitfall: Ошибка выполнения останавливает программу на своей строке — то, что выше, уже выполнилось.
statement: |
  Программа печатает чек из трёх строк, но падает. Прочитайте traceback,
  найдите ошибку и исправьте её так, чтобы вывелись все три строки:
  ```
  Заказ №1042
  Беспроводная мышь — 1499 ₽
  Итого: 1499 ₽
  ```
starter_code: |
  print("Заказ №1042")
  print("Беспроводная мышь — 1499 ₽")
  Print("Итого: 1499 ₽")
check:
  type: tests
  tests:
    - code: |
        assert output == "Заказ №1042\nБеспроводная мышь — 1499 ₽\nИтого: 1499 ₽\n"
      fail: "Выводятся не все строки чека. Первые две печатаются, а потом программа падает — читайте последнюю строку traceback."
solution: |
  print("Заказ №1042")
  print("Беспроводная мышь — 1499 ₽")
  print("Итого: 1499 ₽")
hints:
  - Последняя строка traceback — `NameError`. Какое имя Python не знает?
  - Регистр букв в именах важен.
explanation: |
  `Print` с заглавной буквы — другое имя, функции с таким именем нет: `NameError`.
  Две первые строки при этом успели вывестись — ошибки выполнения происходят
  на конкретной строке. С `SyntaxError` было бы иначе: не вывелось бы ничего.
