<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" role="img" aria-labelledby="t"><title id="t">Устройство сообщения об ошибке: читаем снизу вверх</title>
<style>
text{white-space:pre}
.t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect x="20" y="20" width="560" height="176" rx="14" class="term"/>
<text x="40" y="52" text-anchor="start" class="tt">Traceback (most recent call last):</text>
<text x="40" y="78" text-anchor="start" class="tt">  File &quot;main.py&quot;, line 2, in &lt;module&gt;</text>
<text x="40" y="104" text-anchor="start" class="tt">    prnt(&quot;Заказ №1042 принят&quot;)</text>
<text x="40" y="130" text-anchor="start" class="tterr">    ^^^^</text>
<text x="40" y="156" text-anchor="start" class="tterr">NameError: name 'prnt' is not defined.</text>
<text x="40" y="182" text-anchor="start" class="tterr">Did you mean: 'print'?</text>
<path d="M584 161H620" class="lnd"/>
<circle cx="634" cy="161" r="11" class="acc"/>
<text x="634" y="166" text-anchor="middle" class="onacc">1</text>
<text x="652" y="166" text-anchor="start" class="s">тип ошибки и сообщение — читаем первым</text>
<path d="M584 112H620" class="lnd"/>
<circle cx="634" cy="112" r="11" class="acc"/>
<text x="634" y="117" text-anchor="middle" class="onacc">2</text>
<text x="652" y="117" text-anchor="start" class="s">строка кода и место ошибки в ней</text>
<path d="M584 73H620" class="lnd"/>
<circle cx="634" cy="73" r="11" class="acc"/>
<text x="634" y="78" text-anchor="middle" class="onacc">3</text>
<text x="652" y="78" text-anchor="start" class="s">файл и номер строки</text>
<path d="M584 47H620" class="lnd"/>
<circle cx="634" cy="47" r="11" class="acc"/>
<text x="634" y="52" text-anchor="middle" class="onacc">4</text>
<text x="652" y="52" text-anchor="start" class="s">заголовок: дальше идёт отчёт об ошибке</text>
<path d="M870 180V40" class="ln" marker-end="url(#a)"/>
<text x="20" y="231" text-anchor="start" class="t">Читаем снизу вверх: сначала что случилось, потом где.</text>
<text x="20" y="254" text-anchor="start" class="s">Python показывает подсказку «Did you mean», если похожее имя существует.</text>
</svg>
