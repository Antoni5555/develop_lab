title: Дата в уведомлении
type: exercise
difficulty: 1
pitfall: print ставит пробел между значениями — нужный разделитель задают через sep.
statement: |
  Уведомление о заказе должно показывать дату в формате `2026-10-20`.
  Год, месяц и день передаются в `print` отдельными значениями.
  Исправьте вызов так, чтобы вывелось ровно `2026-10-20`.
  Значения `"2026"`, `"10"`, `"20"` оставьте отдельными аргументами.
starter_code: |
  print("2026", "10", "20")
check:
  type: tests
  tests:
    - code: assert output == "2026-10-20\n"
      fail: "Между значениями должен стоять дефис без пробелов. Что `print` ставит между аргументами по умолчанию?"
    - code: assert '"2026", "10", "20"' in source
      fail: Оставьте год, месяц и день отдельными аргументами — задача про разделитель, а не про строку целиком.
solution: |
  print("2026", "10", "20", sep="-")
hints:
  - Посмотрите в уроке, какой параметр `print` отвечает за разделитель.
  - "`sep=\"-\"`"
explanation: |
  По умолчанию `print` разделяет значения пробелом: `sep=" "`. Параметр `sep` задаёт
  любой другой разделитель, в том числе пустую строку `sep=""`.
