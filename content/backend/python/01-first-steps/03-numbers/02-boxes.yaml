title: Сколько коробок
type: exercise
difficulty: 1
pitfall: Деление нацело округляет вниз, а коробок нужно с запасом — округление вверх.
statement: |
  Склад упаковывает заказы в коробки по `per_box` штук. Посчитайте в переменной `boxes`,
  сколько коробок нужно, чтобы отправить `items` товаров. Неполная коробка — тоже коробка.
  `items` и `per_box` — целые числа, приходят снаружи.
inputs: |
  items = 20
  per_box = 6
starter_code: |
  # items и per_box — входные данные задачи
  boxes = items // per_box
check:
  type: tests
  tests:
    - code: assert run(items=20, per_box=6)["boxes"] == 4
      fail: "20 товаров по 6 в коробке — это 4 коробки: 3 полных и одна с двумя товарами. `//` округляет вниз."
    - code: assert run(items=18, per_box=6)["boxes"] == 3
      fail: "18 товаров по 6 — ровно 3 коробки. Прибавлять одну коробку всегда — неверно."
    - code: assert run(items=1, per_box=6)["boxes"] == 1
      fail: Один товар — одна коробка.
    - code: assert isinstance(run(items=7, per_box=6)["boxes"], int)
      fail: "`boxes` должно быть целым числом (`int`). Обычное деление `/` даёт `float`."
solution: |
  boxes = (items + per_box - 1) // per_box
hints:
  - "`items // per_box` даёт только полные коробки."
  - "Если остаток `items % per_box` не ноль, нужна ещё одна коробка. Как сделать это одной формулой?"
  - "`(items + per_box - 1) // per_box`"
explanation: |
  Прибавляем `per_box - 1` перед делением: если есть хоть один «лишний» товар, сумма переходит
  через следующую границу, и `//` даёт на одну коробку больше; если делится ровно — не переходит.
  Частая ошибка — `items // per_box + 1`: она лишняя, когда делится нацело.
