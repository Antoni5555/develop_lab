title: Количество «2.0»
type: exercise
difficulty: 2
pitfall: int() не разбирает строку с дробной записью.
statement: |
  Мобильное приложение присылает количество товара в формате `"2.0"`, сайт — `"2"`.
  Программа падает на заказах из приложения. Сделайте так, чтобы `qty` было целым числом
  в обоих случаях. Дробных количеств не бывает — после точки всегда ноль.
inputs: |
  quantity = "2.0"
starter_code: |
  # quantity — входные данные задачи
  qty = int(quantity)
check:
  type: tests
  tests:
    - code: assert run(quantity="2.0")["qty"] == 2 and type(run(quantity="2.0")["qty"]) is int
      fail: "Для \"2.0\" нужно целое 2. Что делает `int()` со строкой, в которой есть точка?"
    - code: assert run(quantity="3")["qty"] == 3 and type(run(quantity="3")["qty"]) is int
      fail: "Для \"3\" — целое 3. Обычные значения с сайта ломать нельзя."
solution: |
  qty = int(float(quantity))
hints:
  - "`int(\"2.0\")` — `ValueError`. А `float(\"2.0\")`?"
  - Можно преобразовать в два шага.
explanation: |
  `int()` от строки принимает только запись целого числа. Строку `"2.0"` сначала разбирает `float()`,
  а `int()` от `float` уже работает. Это безопасно, потому что после точки всегда ноль; с деньгами
  такой путь использовать нельзя — там нужен `Decimal`.
