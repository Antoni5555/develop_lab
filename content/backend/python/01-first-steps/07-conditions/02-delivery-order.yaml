title: Тарифы доставки
type: exercise
difficulty: 1
pitfall: В цепочке elif срабатывает первая истинная ветка — порядок проверок важен.
statement: |
  Доставка: от 3000 ₽ — бесплатно, от 1000 ₽ — 199 ₽, дешевле — 399 ₽.
  Крупные заказы почему-то платят 199 ₽. Исправьте код так, чтобы в `delivery`
  была правильная стоимость для любой суммы `total`.
inputs: |
  total = 3500
starter_code: |
  # total — входные данные задачи
  if total >= 1000:
      delivery = 199
  elif total >= 3000:
      delivery = 0
  else:
      delivery = 399
check:
  type: tests
  tests:
    - code: assert run(total=3500)["delivery"] == 0
      fail: "Заказ на 3500 ₽ должен доставляться бесплатно. Какая ветка срабатывает первой?"
    - code: assert run(total=3000)["delivery"] == 0
      fail: "Ровно 3000 ₽ — уже бесплатно («от 3000»)."
    - code: assert run(total=1000)["delivery"] == 199
      fail: "Ровно 1000 ₽ — тариф 199 ₽."
    - code: assert run(total=999)["delivery"] == 399
      fail: "999 ₽ — тариф 399 ₽."
solution: |
  if total >= 3000:
      delivery = 0
  elif total >= 1000:
      delivery = 199
  else:
      delivery = 399
hints:
  - "Для `total = 3500` истинны оба условия: `>= 1000` и `>= 3000`. Какое проверится первым?"
  - Проверяйте пороги от большего к меньшему.
explanation: |
  `elif` проверяется, только если все условия выше оказались ложными. Сумма 3500 проходит первую проверку
  `>= 1000`, и до `>= 3000` дело не доходит. Пороги ставят от самого строгого к самому мягкому.
