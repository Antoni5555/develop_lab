<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t"><title id="t">Имена переменных указывают на значения, у каждого значения свой тип</title>
<style>
text{white-space:pre}
