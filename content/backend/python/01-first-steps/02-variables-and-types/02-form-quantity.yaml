title: Количество из формы
type: exercise
difficulty: 1
pitfall: Строка, умноженная на число, — не ошибка, а повторение строки. Баг проходит молча.
statement: |
  Покупатель кладёт в корзину 3 беспроводные мыши. Количество приходит из формы на сайте.
  Код ниже должен посчитать стоимость позиции, но в `total` оказывается что-то странное.
  Исправьте код так, чтобы в `total` было **целое число** — стоимость трёх мышей.
  Строку `quantity = "3"` не меняйте: так данные приходят из формы.
starter_code: |
  price = 1499
  quantity = "3"   # пришло из формы
  total = price * quantity
  print(total)
check:
  type: tests
  tests:
    - code: assert quantity == "3"
      fail: Значение из формы менять нельзя — оно всегда приходит строкой. Исправлять нужно расчёт.
    - code: assert isinstance(total, int)
      fail: "`total` — не число. Посмотрите `type(quantity)`: что делает `*`, если один из операндов — строка?"
    - code: assert total == 4497
      fail: Тип верный, но сумма не равна 1499 × 3.
solution: |
  price = 1499
  quantity = "3"   # пришло из формы
  total = price * int(quantity)
  print(total)
hints:
  - Выведите `type(quantity)`.
  - Строку `"3"` можно превратить в число `3` функцией `int()`.
explanation: |
  `int * str` в Python — повторение строки: `1499 * "3"` даёт строку из 1499 троек, и ошибки нет.
  Поэтому такой баг легко пропустить: программа работает, но считает ерунду.
  Всё, что приходит снаружи (формы, URL, файлы), — строки. Их нужно явно преобразовать перед расчётом.
