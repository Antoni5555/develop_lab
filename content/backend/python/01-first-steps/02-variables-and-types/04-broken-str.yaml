title: Сломанный ценник
type: exercise
difficulty: 2
pitfall: Переменная с именем встроенной функции «ломает» эту функцию до конца программы.
statement: |
  Код должен собрать ценник вида `1499 ₽`, но падает с ошибкой
  `TypeError: 'str' object is not callable`.
  Найдите причину и исправьте код: название товара храните в переменной `product_name`,
  а ценник — в переменной `label`.
starter_code: |
  str = "Беспроводная мышь"
  price = 1499
  label = str(price) + " ₽"
  print(str, label)
check:
  type: tests
  tests:
    - code: assert "str" not in globals()
      fail: Переменная `str` всё ещё существует и перекрывает встроенную функцию `str()`.
    - code: assert product_name == "Беспроводная мышь"
      fail: Название товара должно храниться в `product_name`.
    - code: assert label == "1499 ₽"
      fail: "Ценник должен быть строкой `1499 ₽` — число, пробел, знак рубля."
solution: |
  product_name = "Беспроводная мышь"
  price = 1499
  label = str(price) + " ₽"
  print(product_name, label)
hints:
  - Что означает имя `str` после первой строки программы?
  - "`str` — это встроенная функция, превращающая значение в строку."
explanation: |
  Встроенные функции (`str`, `list`, `sum`, `id`, `type`…) — тоже просто имена.
  Присваивание `str = "..."` привязывает имя к строке, и функция становится недоступна.
  Ошибка возникает не там, где имя перекрыли, а намного позже, при вызове `str(...)`.
  Поэтому её трудно найти. Правило: не называйте переменные именами встроенных функций.
