title: Карточка снятого с продажи товара
type: exercise
difficulty: 2
pitfall: "«Ноль», «нет» и «неизвестно» — три разных значения: 0, False и None."
statement: |
  Опишите товар переменными с подходящими типами:
  - `name` — «Механическая клавиатура»;
  - `price` — 5990 рублей;
  - `stock` — на складе закончилась, 0 штук;
  - `is_active` — товар снят с продажи;
  - `discount` — скидку ещё не назначали.
starter_code: |
  # замените ... на значения
  name = ...
  price = ...
  stock = ...
  is_active = ...
  discount = ...
check:
  type: tests
  tests:
    - code: assert name == "Механическая клавиатура"
      fail: Проверьте название — строка должна совпадать точно.
    - code: assert type(price) is int and price == 5990
      fail: "Цена — целое число 5990, без кавычек."
    - code: assert stock is not None
      fail: Остаток известен — он равен нулю. `None` значит «неизвестно», а мы точно знаем, что товара нет.
    - code: assert type(stock) is int and stock == 0
      fail: "Остаток — целое число 0. `False` или `\"0\"` — другие типы."
    - code: assert type(is_active) is bool
      fail: "«Снят с продажи» — это да/нет, нужен тип `bool`. Строка `\"False\"` — это непустая строка, а не ложь."
    - code: assert is_active is False
      fail: Товар снят с продажи — значит, `is_active` должен быть ложным.
    - code: assert discount is None
      fail: Скидку не назначали — её значения нет. `0` означал бы «назначили нулевую скидку».
solution: |
  name = "Механическая клавиатура"
  price = 5990
  stock = 0
  is_active = False
  discount = None
hints:
  - Для каждого поля спросите себя: значение известно или нет?
  - Для «да/нет» есть `True` и `False` — без кавычек.
explanation: |
  `stock = 0` — факт: товара нет. `discount = None` — факта нет: скидку ещё не решили.
  `is_active = False` — ответ «нет» на вопрос «в продаже?».
  Если перепутать эти значения, код будет принимать неверные решения: например, показывать «скидка 0 %» там, где скидки просто нет.
