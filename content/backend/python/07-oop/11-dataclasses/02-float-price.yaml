title: Аннотация Decimal, а внутри float
type: exercise
difficulty: 2
pitfall: "Аннотация поля не приводит тип — `price: Decimal` спокойно хранит `float` с его ошибками округления."
statement: |
  Строки прайс-листа приходят из импорта: цена бывает `float` (`0.1`), строкой (`"1499.00"`)
  или `Decimal`. В классе написано `price: Decimal`, но сумма трёх товаров по `0.1` получается
  `0.30000000000000004`. Доработайте `PriceRow` так, чтобы после создания `price` всегда был `Decimal`
  с тем значением, которое видит человек: `0.1` → `Decimal("0.1")`.
starter_code: |
  from dataclasses import dataclass
  from decimal import Decimal


  @dataclass
  class PriceRow:
      product_id: int
      price: Decimal


  rows = [PriceRow(1, 0.1), PriceRow(2, "0.1"), PriceRow(3, Decimal("0.1"))]
  print(sum(row.price for row in rows[:1]) * 3)
check:
  type: tests
  tests:
    - code: |
        row = PriceRow(1, 0.1)
        assert isinstance(row.price, Decimal) and row.price * 3 == Decimal("0.3")
      fail: "`price` остался `float`. Проверяет ли аннотация `price: Decimal` что-нибудь при создании?"
    - code: |
        assert PriceRow(2, "1499.00").price == Decimal("1499.00")
        assert isinstance(PriceRow(2, "1499.00").price, Decimal)
      fail: Строку тоже нужно превратить в `Decimal`.
    - code: |
        d = Decimal("490.00")
        assert PriceRow(3, d).price is d
      fail: "`Decimal` оставляйте как есть."
    - code: |
        assert repr(PriceRow(1, 0.1)) == "PriceRow(product_id=1, price=Decimal('0.1'))"
      fail: "`0.1` должен стать `Decimal('0.1')`, а не `Decimal('0.1000000000000000055511151231257827…')`. Как получить из float его короткую запись?"
solution: |
  from dataclasses import dataclass
  from decimal import Decimal


  @dataclass
  class PriceRow:
      product_id: int
      price: Decimal

      def __post_init__(self):
          if not isinstance(self.price, Decimal):
              self.price = Decimal(str(self.price))


  rows = [PriceRow(1, 0.1), PriceRow(2, "0.1"), PriceRow(3, Decimal("0.1"))]
  print(sum(row.price for row in rows[:1]) * 3)
hints:
  - "Выведите `type(PriceRow(1, 0.1).price)`."
  - "Приведите тип в `__post_init__`. Сравните `Decimal(0.1)` и `Decimal(str(0.1))`."
explanation: |
  Аннотации dataclass нужны, чтобы найти поля, и ничего не проверяют. `float` сохраняется как есть
  вместе с двоичной погрешностью. `__post_init__` вызывается после заполнения полей — там тип
  приводится к нужному. Через `str`, потому что `Decimal(0.1)` переносит в `Decimal` всю погрешность
  float, а `str(0.1)` даёт короткую запись `"0.1"`, которую и имел в виду человек.
