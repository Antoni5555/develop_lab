title: Проверка, которую обходят через extend
type: exercise
difficulty: 3
pitfall: Наследник `list` с проверкой в `append` пропускает данные через `extend`, `insert`, `+=` и срезы.
statement: |
  Список позиций заказа не должен принимать позицию с количеством меньше 1.
  `OrderLines` унаследован от `list`, проверка — в `append`. Но импорт заказов из CSV
  добавляет позиции через `extend`, и в заказы попадают нулевые количества.
  Перепишите `OrderLines` через композицию. Метод `add(line)` проверяет и добавляет позицию
  (неверная — `ValueError`), `add_many(lines)` добавляет несколько с той же проверкой.
  `len(lines)` и `for line in lines` должны работать. Позиция — кортеж `(product_id, quantity)`.
starter_code: |
  class OrderLines(list):
      def append(self, line):
          product_id, quantity = line
          if quantity < 1:
              raise ValueError(f"товар {product_id}: количество должно быть не меньше 1")
          super().append(line)


  lines = OrderLines()
  lines.append((1, 2))
  lines.extend([(5, 0), (7, 1)])
  print(list(lines))
check:
  type: tests
  tests:
    - code: |
        ls = OrderLines()
        assert not hasattr(ls, "extend") and not hasattr(ls, "insert") and not isinstance(ls, list)
      fail: "У `OrderLines` есть методы `list`, которые обходят проверку. Нужно ли наследовать от `list`, чтобы хранить список?"
    - code: |
        ls = OrderLines()
        ls.add((1, 2))
        try:
            ls.add_many([(5, 1), (7, 0)])
        except ValueError:
            pass
        else:
            raise AssertionError
        try:
            ls.add((9, 0))
        except ValueError:
            pass
        else:
            raise AssertionError
        assert all(q >= 1 for _, q in ls)
      fail: "`add` и `add_many` должны отклонять количество меньше 1 через `ValueError`."
    - code: |
        ls = OrderLines()
        ls.add((1, 2))
        ls.add_many([(5, 1), (7, 3)])
        assert len(ls) == 3 and list(ls) == [(1, 2), (5, 1), (7, 3)]
        assert [q for _, q in ls] == [2, 1, 3]
      fail: Нужны `len(...)` и перебор `for` по позициям в порядке добавления.
solution: |
  class OrderLines:
      def __init__(self):
          self._lines = []

      def add(self, line):
          product_id, quantity = line
          if quantity < 1:
              raise ValueError(f"товар {product_id}: количество должно быть не меньше 1")
          self._lines.append(line)

      def add_many(self, lines):
          for line in lines:
              self.add(line)

      def __len__(self):
          return len(self._lines)

      def __iter__(self):
          return iter(self._lines)


  lines = OrderLines()
  lines.add((1, 2))
  try:
      lines.add_many([(5, 0), (7, 1)])
  except ValueError as e:
      print(e)
  print(list(lines))
hints:
  - "Посчитайте, сколькими способами можно изменить `list`: `append`, `extend`, `insert`, `+=`, `lines[0] = ...`…"
  - "Храните список в `self._lines`, откройте только `add`, `add_many`, `__len__` и `__iter__`."
  - "`add_many` вызывает `self.add` для каждой позиции — проверка написана один раз."
explanation: |
  У `list` много способов изменить содержимое, и встроенные методы не вызывают ваш `append`
  изнутри. Переопределив один метод, вы оставляете остальные открытыми. Композиция переворачивает
  подход: список спрятан в атрибуте, а наружу выходят только методы, которые вы написали
  и проверили. `__len__` и `__iter__` сохраняют привычное поведение коллекции.
  В эталоне `(5, 1)` успевает добавиться до ошибки на `(7, 0)` — если нужно «всё или ничего»,
  сначала проверяют все позиции, потом добавляют.
