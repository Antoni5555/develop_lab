title: Какой ключ останется
type: predict
difficulty: 2
pitfall: Равные значения разных типов — один ключ; ключ остаётся от первой вставки, значение — от последней.
statement: |
  Модуль фильтров каталога собирает флаги из разных источников.
  Что выведет код?
code: |
  flags = {True: "в наличии", 1: "один товар"}
  print(flags)
  print(len({0, False, 0.0, ""}))
answer: |
  {True: 'один товар'}
  2
explanation: |
  `True == 1`, хеши равны, значит, это один ключ. При повторной записи Python
  обновляет только значение, сам ключ остаётся от первой вставки, поэтому в выводе `True`, а не `1`.
  `0`, `False` и `0.0` равны друг другу и дают один элемент множества, а пустая строка `""` им не равна — второй элемент.
