<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" class="fig" role="img" aria-labelledby="t"><title id="t">Как dict ищет ключ: хеш, ячейка, сравнение через ==</title>
<style>
