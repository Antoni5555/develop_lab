<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="20" width="180" height="46" rx="12" class="fig-box"/>
<text x="110.0" y="48.0" text-anchor="middle" class="fig-c">ключ: (42, &quot;M&quot;)</text>
<rect x="250" y="20" width="170" height="46" rx="12" class="fig-box"/>
