<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" class="fig" role="img" aria-labelledby="t"><title id="t">Ключ изменили после вставки: поиск по старому и новому хешу не находит запись</title>
